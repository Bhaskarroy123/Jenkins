<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-left: 4px solid #007bff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form method="POST">

        <label>Student Name</label>
        <input type="text" name="name" required>

        <label>Course</label>
        <input type="text" name="course" required>

        <label>Feedback</label>
        <textarea name="feedback" required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <h2>Submitted Feedback</h2>

    {% for item in feedbacks %}

    <div class="feedback">
        <strong>Name:</strong> {{ item.name }} <br><br>
        <strong>Course:</strong> {{ item.course }} <br><br>
        <strong>Feedback:</strong> {{ item.feedback }}
    </div>

    {% else %}

    <p>No feedback submitted yet.</p>

    {% endfor %}

</div>

</body>
</html>
